<!DOCTYPE html>
<html lang="en">
<head>
    <style>
.box{
    height: 250px;
    width: 250px;
    /* overflow: hidden; */
    position: relative;
}
img{
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: 400ms;
}
.box:hover img:nth-child(3){
    left: 250px;
}
.box:hover img:nth-child(2){
    left: 500px;
}
 img:nth-child(1){
    /* left: 750px; */
    transition-delay: 200ms;
}
img:nth-child(2){
    transition-delay: 100ms;
}
.box:hover img:nth-child(1){
    left: 750px;
    /* transition-delay: 100ms; */
}

    </style>
</head>
<body>
    <div class="box">
   <img src="images/1.jpg" alt="">
   <img src="images/3.jpg" alt="">
   <img src="images/4.jpg" alt="">
   <img src="images/5.jpg" alt="">
    </div>
</body>
</html>
