<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .main{
        width: 200px;
        height: 300px;
        margin: 0 auto;
        position: relative;
        overflow: hidden;
    }
    img{
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transition: 500ms;
    }
    .main:hover img:nth-child(1){
        top: 300px;
        left: -300px;
    }
    .main:hover img:nth-child(2){
        top:300px;
        left: -100px;
    }
    .main:hover img:nth-child(3){
        top: 300px;
        left: 100px;
    }
    .main:hover img:nth-child(4){
        top: 300px;
        left: 300px;
    }
  </style>
</head>
<body>
    <div class="main">
        <img src="images/1.jpg" alt="">
        <img src="images/3.jpg" alt="">
        <img src="images/4.jpg" alt="">
        <img src="images/5.jpg" alt="">
        <img src="images/img-1.jpg" alt="">
    </div>
</body>
</html>
