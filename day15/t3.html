<!DOCTYPE html>
<html lang="en">
<head>
    <style>
.main{
    height: 300px;
    width: 200px;
    position: relative;
}
img{
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: 500ms;
}
.main:hover img:nth-child(1){
    left:200px ;
}
.main:hover img:nth-child(2){
   top: 300px;
   left: 200px;
}
.main:hover img:nth-child(3){
    top: 300px;
}

    </style>
</head>
<body>
    <div class="main">
        <img src="images/1.jpg" alt="">
        <img src="images/3.jpg" alt="">
        <img src="images/4.jpg" alt="">
        <img src="images/5.jpg" alt="">
    </div>
</body>
</html>
